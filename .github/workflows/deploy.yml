name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install + Build
        run: |
          bun install --frozen-lockfile
          bun run db:generate
          bun run build
      - name: Create deployment package
        run: |
          mkdir -p deploy-pkg
          cp -r .next/standalone deploy-pkg/
          cp -r .next/static deploy-pkg/.next/
          cp -r public deploy-pkg/
          cp -r prisma deploy-pkg/
          cp package.json deploy-pkg/
      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          source: "deploy-pkg/*"
          target: ${{ secrets.DEPLOY_PATH || '/var/www/alaminn.info' }}
      - name: Restart application + migrate + health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/var/www/alaminn.info' }}
            bun install --production
            bun run db:migrate:deploy
            pm2 restart alaminn-info || pm2 start "node .next/standalone/server.js" --name alaminn-info
      - name: Health check
        run: |
          sleep 10
          curl --fail --max-time 30 https://alaminn.info/api/health
