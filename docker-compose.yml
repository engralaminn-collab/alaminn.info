# ═══════════════════════════════════════════════════════════════════
#  Alaminn.info — Docker Compose (production stack)
#  Usage:
#    docker compose up -d --build
#    docker compose logs -f
#    docker compose down
# ═══════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alaminn-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/db/production.db}
      - AUTH_SECRET=${AUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://alaminn.info}
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - app-storage:/app/storage
      - app-db:/app/db
    networks:
      - alaminn-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The authoritative Prisma schema is SQLite. /app/db is a named volume so
  # application data survives image replacement; MySQL is intentionally not
  # advertised because this release has no provider-compatible MySQL schema.

  # ── Optional: Nginx reverse proxy (SSL termination) ──────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: alaminn-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx-alaminn-info.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     - app
  #   networks:
  #     - alaminn-net

volumes:
  app-storage:
  app-db:

networks:
  alaminn-net:
    driver: bridge
